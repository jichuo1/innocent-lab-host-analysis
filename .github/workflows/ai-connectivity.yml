name: AI API connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check catalogs without generation
        env:
          AI_API_KEY_PRIMARY: ${{ secrets.AI_API_KEY_PRIMARY }}
          AI_API_KEY_BACKUP: ${{ secrets.AI_API_KEY_BACKUP }}
          AI_PRIMARY_BASE_URL: ${{ vars.AI_PRIMARY_BASE_URL }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL }}
          AI_PRIMARY_TOOL_CHOICE_MODE: ${{ vars.AI_PRIMARY_TOOL_CHOICE_MODE }}
          AI_PRIMARY_OUTPUT_TOKEN_PARAMETER: ${{ vars.AI_PRIMARY_OUTPUT_TOKEN_PARAMETER }}
          AI_BACKUP_BASE_URL: ${{ vars.AI_BACKUP_BASE_URL }}
          AI_BACKUP_MODEL: ${{ vars.AI_BACKUP_MODEL }}
          AI_BACKUP_TOOL_CHOICE_MODE: ${{ vars.AI_BACKUP_TOOL_CHOICE_MODE }}
          AI_BACKUP_OUTPUT_TOKEN_PARAMETER: ${{ vars.AI_BACKUP_OUTPUT_TOKEN_PARAMETER }}
        run: python tools/hostlab/check_ai_connectivity.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-connectivity-${{ github.run_id }}
          path: runtime/hostlab/connectivity/report.json
          retention-days: 7
