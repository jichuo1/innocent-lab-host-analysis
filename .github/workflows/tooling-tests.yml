name: Analysis tooling tests
on:
  pull_request:
    paths: ['tools/hostlab/**/*.py', 'tools/hostlab/**/*.java', 'tools/hostlab/examples/*.json', 'tools/hostlab/requirements*.txt', '.github/workflows/host-analysis.yml', '.github/workflows/tooling-tests.yml']
  push:
    branches: [main]
    paths: ['tools/hostlab/**/*.py', 'tools/hostlab/**/*.java', 'tools/hostlab/examples/*.json', 'tools/hostlab/requirements*.txt', '.github/workflows/host-analysis.yml', '.github/workflows/tooling-tests.yml']
permissions:
  contents: read
jobs:
  test:
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/hostlab/requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile audit against verified pinned JADX
        run: |
          python tools/hostlab/install_jadx.py
          mkdir -p runtime/hostlab/audit-compile
          javac -J-Xmx512m -encoding UTF-8 -cp tools/hostlab/vendor/jadx-1.5.6-all.jar -d runtime/hostlab/audit-compile tools/hostlab/analysis/HostCompatibilityAudit.java tools/hostlab/analysis/SingleClassDump.java
      - name: Offline source, dispatch, AI and report checks
        working-directory: tools/hostlab
        run: python -B -m unittest discover -p 'test_*.py' -v
      - name: Fingerprint dependency runtime
        id: runtime-key
        run: python tools/hostlab/prepare_runtime.py fingerprint --requirements requirements-query.txt
      - name: Restore verified dependency runtime
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        continue-on-error: true
        with:
          # Share only the dependency environment, never samples or credentials.
          path: runtime/hostlab-prepared
          key: hostlab-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.fingerprint }}
      - name: Prepare and verify query dependencies
        id: runtime
        run: python tools/hostlab/prepare_runtime.py prepare --requirements requirements-query.txt
      - name: Verify actual isolated runtime and prepared bytecode
        run: |
          runtime/hostlab-prepared/env/bin/python -B tools/hostlab/test_remote_mcp.py
          python -c "import sys; sys.path.insert(0,'tools/hostlab'); import prepare_runtime as p; identity,fingerprint=p.describe('requirements-query.txt'); assert p.verify(p.directory(),identity,fingerprint); assert p.prepare('requirements-query.txt')['cache_hit']"
      - name: Save verified dependency runtime
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jichuo1/innocent-lab-host-analysis' && steps.runtime.outputs.built == 'true' && steps.runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        continue-on-error: true
        with:
          path: runtime/hostlab-prepared
          key: hostlab-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.fingerprint }}
