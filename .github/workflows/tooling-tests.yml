name: Analysis tooling tests
on:
  pull_request:
    paths: ['tools/hostlab/**/*.py', 'tools/hostlab/examples/*.json', 'tools/hostlab/requirements*.txt', '.github/workflows/host-analysis.yml', '.github/workflows/tooling-tests.yml']
  push:
    branches: [main]
    paths: ['tools/hostlab/**/*.py', 'tools/hostlab/examples/*.json', 'tools/hostlab/requirements*.txt', '.github/workflows/host-analysis.yml', '.github/workflows/tooling-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/hostlab/requirements.txt
      - name: Offline source, dispatch, AI and report checks
        working-directory: tools/hostlab
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Verify actual isolated runtime and prepared bytecode
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/hostlab/prepare_runtime.py prepare --requirements requirements-query.txt
          runtime/hostlab-prepared/env/bin/python tools/hostlab/test_remote_mcp.py
          python -c "import sys; sys.path.insert(0,'tools/hostlab'); import prepare_runtime as p; identity,fingerprint=p.describe('requirements-query.txt'); assert p.verify(p.directory(),identity,fingerprint); assert p.prepare('requirements-query.txt')['cache_hit']"
