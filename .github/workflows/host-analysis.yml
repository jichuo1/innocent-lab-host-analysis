name: Host APK analysis
run-name: hostlab-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      version_code:
        required: true
        type: string
      operation:
        required: true
        type: choice
        options: [inventory, info, query, decode, string_refs, decompile, audit, multipath_audit, regenerate_ai, source_check, batch, batch_group, backend_validation]
      runner_revision:
        description: 'Immutable analysis tooling commit selected by the scheduler'
        required: false
        type: string
      source_revision:
        required: false
        type: string
      module_source:
        description: 'Pinned private module source binding JSON'
        required: false
        type: string
      apk_sha256:
        required: false
        type: string
      baseline_sha256:
        required: false
        type: string
      argument:
        required: false
        type: string
      max_cell_chars:
        description: 'Query cell preview length (1..16000)'
        required: false
        type: string
        default: '300'
permissions:
  contents: read
concurrency:
  group: ${{ ((inputs.operation == 'multipath_audit' || inputs.operation == 'regenerate_ai') && 'hostlab-ai-provider-slot') || format('hostlab-{0}', (inputs.operation == 'batch_group' && inputs.request_id) || inputs.apk_sha256 || (inputs.operation == 'batch' && inputs.version_code) || inputs.request_id) }}
  queue: max
  cancel-in-progress: false
jobs:
  analyze:
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.runner_revision || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Plan dependency subset
        id: plan
        env:
          HOSTLAB_OPERATION: ${{ inputs.operation }}
          HOSTLAB_ARGUMENT: ${{ inputs.argument }}
        run: python tools/hostlab/plan_ci.py
      - uses: actions/setup-java@v5
        if: steps.plan.outputs.needs_java == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Fingerprint dependency runtime
        id: runtime-key
        env:
          REQUIREMENTS: ${{ steps.plan.outputs.requirements }}
        run: python tools/hostlab/prepare_runtime.py fingerprint --requirements "$REQUIREMENTS"
      - name: Restore verified dependency runtime
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        continue-on-error: true
        with:
          path: runtime/hostlab-prepared
          key: hostlab-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.fingerprint }}
      - name: Prepare and verify analysis dependencies
        id: runtime
        env:
          REQUIREMENTS: ${{ steps.plan.outputs.requirements }}
        run: python tools/hostlab/prepare_runtime.py prepare --requirements "$REQUIREMENTS"
      - name: Save verified dependency runtime
        if: steps.runtime.outputs.built == 'true' && steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        continue-on-error: true
        with:
          path: runtime/hostlab-prepared
          key: hostlab-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime-key.outputs.fingerprint }}
      - name: Download verified optional DexSQL
        if: steps.plan.outputs.needs_dexsql == 'true'
        continue-on-error: ${{ steps.plan.outputs.dexsql_optional == 'true' }}
        run: python tools/hostlab/install_dexsql.py
      - name: Download verified JADX
        if: inputs.operation == 'audit' || inputs.operation == 'decompile' || inputs.operation == 'multipath_audit' || inputs.operation == 'backend_validation'
        run: python tools/hostlab/install_jadx.py
      - name: Backend and scheduler regression tests
        if: inputs.operation == 'backend_validation'
        working-directory: tools/hostlab
        run: python -m unittest discover -p 'test_*.py' -q
      - name: Analyze private sample
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          HOSTLAB_VERSION: ${{ inputs.version_code }}
          HOSTLAB_OPERATION: ${{ inputs.operation }}
          HOSTLAB_ARGUMENT: ${{ inputs.argument }}
          HOSTLAB_MAX_CELL_CHARS: ${{ inputs.max_cell_chars }}
          HOSTLAB_REVISION: ${{ inputs.source_revision }}
          HOSTLAB_MODULE_SOURCE: ${{ inputs.module_source }}
          HOSTLAB_SHA: ${{ inputs.apk_sha256 }}
          HOSTLAB_BASELINE_SHA: ${{ inputs.baseline_sha256 }}
          HOSTLAB_RUNNER_REVISION: ${{ inputs.runner_revision }}
          JAVA_TOOL_OPTIONS: '-Xmx4g'
          GH_TOKEN: ${{ github.token }}
        run: python tools/hostlab/remote_job.py
      - name: AI evidence review
        if: inputs.operation == 'multipath_audit' || inputs.operation == 'regenerate_ai'
        timeout-minutes: 35
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_API_KEY_PRIMARY: ${{ secrets.AI_API_KEY_PRIMARY }}
          AI_API_KEY_BACKUP: ${{ secrets.AI_API_KEY_BACKUP }}
          AI_PRIMARY_BASE_URL: ${{ vars.AI_PRIMARY_BASE_URL }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL }}
          AI_PRIMARY_OUTPUT_TOKEN_PARAMETER: ${{ vars.AI_PRIMARY_OUTPUT_TOKEN_PARAMETER }}
          AI_BACKUP_BASE_URL: ${{ vars.AI_BACKUP_BASE_URL }}
          AI_BACKUP_MODEL: ${{ vars.AI_BACKUP_MODEL }}
          AI_BACKUP_OUTPUT_TOKEN_PARAMETER: ${{ vars.AI_BACKUP_OUTPUT_TOKEN_PARAMETER }}
          AI_ALLOW_FALLBACK: ${{ vars.AI_ALLOW_FALLBACK }}
          AI_DEFAULT_PROFILE: ${{ vars.AI_DEFAULT_PROFILE }}
        run: python tools/hostlab/ai_review.py
      - name: Upload bounded analysis results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: host-analysis-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            runtime/hostlab/remote-output/
            runtime/hostlab/reports/
            !runtime/hostlab/reports/**/classes/**
            !runtime/hostlab/reports/**/jadx-output/**
  publish:
    if: always() && (inputs.operation == 'multipath_audit' || inputs.operation == 'regenerate_ai')
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: host-analysis-${{ github.run_id }}
          path: runtime/hostlab/publish-input
      - name: Publish private Release and reports branch
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTLAB_VERSION: ${{ inputs.version_code }}
          HOSTLAB_REQUEST_ID: ${{ inputs.request_id }}
        run: python tools/hostlab/publish_report.py
