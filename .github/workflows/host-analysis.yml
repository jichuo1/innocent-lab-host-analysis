name: Host APK analysis
run-name: hostlab-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      version_code:
        required: true
        type: string
      operation:
        required: true
        type: choice
        options: [inventory, info, query, decode, string_refs, decompile, audit, multipath_audit, regenerate_ai]
      source_revision:
        required: false
        type: string
      apk_sha256:
        required: false
        type: string
      baseline_sha256:
        required: false
        type: string
      argument:
        required: false
        type: string
      max_cell_chars:
        description: 'Query cell preview length (1..16000)'
        required: false
        type: string
        default: '300'
permissions:
  contents: read
concurrency:
  group: hostlab-${{ inputs.apk_sha256 || inputs.request_id }}
  cancel-in-progress: false
jobs:
  analyze:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install analysis dependencies
        run: python -m pip install -r tools/hostlab/requirements.txt
      - name: Download verified JADX
        if: inputs.operation == 'audit' || inputs.operation == 'decompile' || inputs.operation == 'multipath_audit' || inputs.operation == 'regenerate_ai'
        run: python tools/hostlab/install_jadx.py
      - name: Analyze private sample
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          HOSTLAB_VERSION: ${{ inputs.version_code }}
          HOSTLAB_OPERATION: ${{ inputs.operation }}
          HOSTLAB_ARGUMENT: ${{ inputs.argument }}
          HOSTLAB_MAX_CELL_CHARS: ${{ inputs.max_cell_chars }}
          HOSTLAB_REVISION: ${{ inputs.source_revision }}
          HOSTLAB_SHA: ${{ inputs.apk_sha256 }}
          HOSTLAB_BASELINE_SHA: ${{ inputs.baseline_sha256 }}
          JAVA_TOOL_OPTIONS: '-Xmx4g'
          GH_TOKEN: ${{ github.token }}
        run: python tools/hostlab/remote_job.py
      - name: AI evidence review
        if: inputs.operation == 'multipath_audit' || inputs.operation == 'regenerate_ai'
        timeout-minutes: 35
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AI_API_KEY_PRIMARY: ${{ secrets.AI_API_KEY_PRIMARY }}
          AI_API_KEY_BACKUP: ${{ secrets.AI_API_KEY_BACKUP }}
          AI_PRIMARY_BASE_URL: ${{ vars.AI_PRIMARY_BASE_URL }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL }}
          AI_BACKUP_BASE_URL: ${{ vars.AI_BACKUP_BASE_URL }}
          AI_BACKUP_MODEL: ${{ vars.AI_BACKUP_MODEL }}
          AI_ALLOW_FALLBACK: ${{ vars.AI_ALLOW_FALLBACK }}
          AI_DEFAULT_PROFILE: ${{ vars.AI_DEFAULT_PROFILE }}
        run: python tools/hostlab/ai_review.py
      - name: Upload bounded analysis results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: host-analysis-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            runtime/hostlab/remote-output/
            runtime/hostlab/reports/
            !runtime/hostlab/reports/**/classes/**
            !runtime/hostlab/reports/**/jadx-output/**
  publish:
    if: always() && (inputs.operation == 'multipath_audit' || inputs.operation == 'regenerate_ai')
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.1
        continue-on-error: true
        with:
          name: host-analysis-${{ github.run_id }}
          path: runtime/hostlab/publish-input
      - name: Publish private Release and reports branch
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTLAB_VERSION: ${{ inputs.version_code }}
          HOSTLAB_REQUEST_ID: ${{ inputs.request_id }}
        run: python tools/hostlab/publish_report.py
